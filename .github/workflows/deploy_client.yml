name: Deploy Client
run-name: Released latest version of client to VM.
on:
  workflow_dispatch:
  push:
    branches:
      - 'releases/**'
jobs:
  build-and-deploy-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20.17.0
      - name: Yarn Setup
        # You may pin to the exact commit or the version.
        # uses: DerYeger/yarn-setup-action@f55be5383ea94f5eb25b20aee609af4603a68dde
        uses: DerYeger/yarn-setup-action@master
        with:
          # The version of Node.js that will be used
          node-version: 20.17.0
      - name: Yarn Client
        run: |
          yarn --cwd ./client 
      - name: Yarn Server
        run: |
          yarn --cwd ./server 
      - name: Yarn Client-Common
        run: |
          yarn --cwd ./client-common 
      - name: Install Quasar
        run: |
          npm i -g @quasar/cli
      - name: Quasar Build
        working-directory: ./client
        run: |
          quasar build
      - name: Copy files via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.LIGHT_ARCHIVES_HOST }}
          username: ${{ secrets.LIGHT_ARCHIVES_USERNAME }}
          port: ${{ secrets.LIGHT_ARCHIVES_PORT }}
          key: ${{ secrets.LIGHT_ARCHIVES_PRIVATESSHKEY }}
          source: "./client/dist/*"
          target: "/var/www/archive"
