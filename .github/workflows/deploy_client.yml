name: Deploy Client
run-name: Released latest version of client to VM.
on:
  workflow_dispatch:
  push:
    branches:
      - 'releases/**'
jobs:
  build-and-deploy-client:
    runs-on: ubuntu-latest
    env:
      SENTRY_RELEASE: ${{ github.sha }}
      SENTRY_ENVIRONMENT: production
      SENTRY_DSN: ${{ secrets.SENTRY_DSN_CLIENT }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT_CLIENT: ${{ secrets.SENTRY_PROJECT_CLIENT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20.17.0
      - name: Yarn Setup
        # You may pin to the exact commit or the version.
        # uses: DerYeger/yarn-setup-action@f55be5383ea94f5eb25b20aee609af4603a68dde
        uses: DerYeger/yarn-setup-action@master
        with:
          # The version of Node.js that will be used
          node-version: 20.17.0
      - name: Yarn Client
        run: |
          yarn --cwd ./client 
      - name: Yarn Server
        run: |
          yarn --cwd ./server 
      - name: Yarn Client-Common
        run: |
          yarn --cwd ./client-common 
      - name: Install Quasar
        run: |
          npm i -g @quasar/cli
      - name: Quasar Build
        working-directory: ./client
        run: |
          quasar build
      - name: Clean deploy directory via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHT_ARCHIVES_HOST }}
          username: ${{ secrets.LIGHT_ARCHIVES_USERNAME }}
          port: ${{ secrets.LIGHT_ARCHIVES_PORT }}
          key: ${{ secrets.LIGHT_ARCHIVES_PRIVATESSHKEY }}
          script: |
            rm -rf ${{ secrets.LIGHT_ARCHIVES_DIRECTORY }}/* || true
      - name: Copy files via SSH
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.LIGHT_ARCHIVES_HOST }}
          username: ${{ secrets.LIGHT_ARCHIVES_USERNAME }}
          port: ${{ secrets.LIGHT_ARCHIVES_PORT }}
          key: ${{ secrets.LIGHT_ARCHIVES_PRIVATESSHKEY }}
          source: "./client/dist/spa/*"
          target: ${{ secrets.LIGHT_ARCHIVES_DIRECTORY }}
          strip_components: 3
      - name: Create Sentry release and upload sourcemaps
        if: ${{ env.SENTRY_AUTH_TOKEN != '' && env.SENTRY_ORG != '' && env.SENTRY_PROJECT_CLIENT != '' }}
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ env.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ env.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ env.SENTRY_PROJECT_CLIENT }}
        with:
          release: ${{ env.SENTRY_RELEASE }}
          environment: ${{ env.SENTRY_ENVIRONMENT }}
          set_commits: skip
          sourcemaps: ./client/dist/spa
          url_prefix: '~/'
          strip_common_prefix: true
          ignore_empty: true
          ignore_missing: true
