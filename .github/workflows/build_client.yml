
name: Build Client
run-name: Build Client for PR Commit.
on:
  pull_request:
jobs:
  build-client:
    runs-on: ubuntu-latest
    env:
      npm_config_build_from_source: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20.17.0
      - name: Install native build deps (sharp/node-gyp)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 make g++ pkg-config libvips-dev
      - name: Yarn Setup
        # You may pin to the exact commit or the version.
        # uses: DerYeger/yarn-setup-action@f55be5383ea94f5eb25b20aee609af4603a68dde
        uses: DerYeger/yarn-setup-action@master
        with:
          # The version of Node.js that will be used
          node-version: 20.17.0
      - name: Yarn Client
        run: |
          yarn --cwd ./client 
      - name: Yarn Server
        run: |
          yarn --cwd ./server 
      - name: Yarn Client-Common
        run: |
          yarn --cwd ./client-common 
      - name: Install Quasar
        run: |
          npm i -g @quasar/cli
      - name: Quasar Build
        working-directory: ./client
        run: |
          quasar build
