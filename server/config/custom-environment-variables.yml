server:
  frontendRoot: FRONTEND_ROOT

auth:
  jwtSecret: JWT_SECRET
  jwtExpiry: JWT_EXPIRY
  scopedJwtExpiry: JWT_SCOPED_EXPIRY
  refreshTokenExpiry: REFRESH_TOKEN_EXPIRY
  discordClientId: AUTH_DISCORD_CLIENT_ID
  discordClientSecret: AUTH_DISCORD_CLIENT_SECRET
  discordCallbackUrl: AUTH_DISCORD_CALLBACK_URL
  discordRppCallbackUrl: AUTH_DISCORD_RPP_CALLBACK_URL

s3:
  endpoint: S3_ENDPOINT
  bucketName: S3_BUCKET_NAME
  publicRootUrl: S3_PUBLIC_ROOT_URL
  accessKeyId: S3_ACCESS_KEY_ID
  secretAccessKey: S3_SECRET_ACCESS_KEY

db:
  host: DB_HOST
  port: DB_PORT
  database: DB_NAME
  username: DB_USER
  password: DB_PASSWORD
  logging:
    __name: DB_LOGGING
    __format: json

redis:
  host: REDIS_HOST
  port: REDIS_PORT

discord:
  botToken: DISCORD_BOT_TOKEN
  serverId: DISCORD_SERVER_ID
  announcementChannel: DISCORD_ANNOUNCEMENT_CHANNEL
  noticeboardChannel: DISCORD_NOTICEBOARD_CHANNEL
