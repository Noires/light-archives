services:
  redis:
    image: redis:8.4-alpine
    restart: always
    volumes:
      - /home/_USER_/volumes/redis:/data:rw,z
    ports:
      - '16379:6379'
    expose:
      - 6379

  mariadb:
    image: mariadb:11.8
    restart: always
    volumes:
      - /home/_USER_/volumes/mariadb:/var/lib/mysql:rw,z
    expose:
      - 3306
    ports:
      - '13306:3306'
    environment:
      - MARIADB_RANDOM_ROOT_PASSWORD=yes
      - MARIADB_USER=mariadb
      - MARIADB_PASSWORD=mariadb
      - MARIADB_DATABASE=lightarchives
      - TZ=UTC

  steward:
    build: ./
    image: chaosarchives
    restart: always
    init: true
    links:
      - mariadb
    depends_on:
      - mariadb
    command: node dist/apps/steward/main.js
    expose:
      - 8112
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - NODE_OPTIONS=${NODE_OPTIONS:---enable-source-maps}
      # Sentry
      - SENTRY_DSN=${SENTRY_DSN_STEWARD:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE_STEWARD:-0.02}

  chaosarchives:
    build: ./
    image: chaosarchives
    restart: always
    init: true
    links:
      - mariadb
      - redis
      - steward
    depends_on:
      - mariadb
      - redis
      - steward
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - NODE_OPTIONS=${NODE_OPTIONS:---enable-source-maps}
      # Sentry
      - SENTRY_DSN=${SENTRY_DSN_CHAOSARCHIVES:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE_CHAOSARCHIVES:-0.05}
      # Database settings
      - DB_LOGGING=${DB_LOGGING:-["error","warn"]}
      # Authentication
      - JWT_SECRET=${JWT_SECRET:-_JWTSECRET_}
      - REFRESH_TOKEN_EXPIRY=${REFRESH_TOKEN_EXPIRY:-30d}
      - AUTH_DISCORD_CLIENT_ID=${AUTH_DISCORD_CLIENT_ID:-_DISCORDCLIENTID_}
      - AUTH_DISCORD_CLIENT_SECRET=${AUTH_DISCORD_CLIENT_SECRET:-_DISCORDCLIENTSECRET_}
      - AUTH_DISCORD_CALLBACK_URL=${AUTH_DISCORD_CALLBACK_URL:-https://elpisgarten.de/api/internal/user/login/discord/callback}
      - AUTH_DISCORD_RPP_CALLBACK_URL=${AUTH_DISCORD_RPP_CALLBACK_URL:-https://elpisgarten.de/api/rpp/login/discord/callback}
    ports:
      - '${CHAOSARCHIVES_EXTERNAL_PORT:-8111}:8111'
